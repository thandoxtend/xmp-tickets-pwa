<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1A56DB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sign In | XMP Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(26, 86, 219, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
        }

        .login-container {
            position: relative;
            z-index: 10;
            max-width: 460px;
            width: 100%;
            margin: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #1A56DB 0%, #3B82F6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: white;
            margin: 0 auto 16px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.02em;
        }

        .logo p {
            font-size: 14px;
            color: #94A3B8;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #CBD5E1;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: white;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3B82F6;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group input::placeholder {
            color: #64748B;
        }

        .checkbox-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #3B82F6;
        }

        .checkbox span {
            font-size: 13px;
            color: #94A3B8;
        }

        .forgot-link {
            font-size: 13px;
            color: #3B82F6;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1A56DB 0%, #3B82F6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(26, 86, 219, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .loading-message {
            background: rgba(59, 130, 246, 0.15);
            color: #60A5FA;
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
        }

        .mfa-section {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer p {
            font-size: 12px;
            color: #64748B;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">X</div>
                <h1>XMP Tickets</h1>
                <p>Access the Xtend Management Platform</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="loadingMessage" class="loading-message"></div>

            <div id="loginSection">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="username" placeholder="thando@xtend.co" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                </div>
                <div class="checkbox-group">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe"> <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign in</button>
            </div>

            <div id="mfaSection" class="mfa-section">
                <div class="form-group">
                    <label>Authentication Code</label>
                    <input type="text" id="mfaCode" placeholder="Enter 6-digit code" maxlength="6" autocomplete="one-time-code">
                </div>
                <button class="btn-login" onclick="verifyMfa()">Verify & Continue</button>
                <button class="btn-login" style="background: rgba(255,255,255,0.1); margin-top: 12px;" onclick="backToLogin()">Back</button>
            </div>

            <div class="footer">
                <p>Protected by Xtend IAM - Secured with AWS Cognito</p>
                <p style="margin-top: 8px;">XMP | Xtend Mobility Platform</p>
            </div>
        </div>
    </div>

    <script>
        const PROXY_URL = '';
        let loginSession = null;
        let currentUsername = null;

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showLoading(msg) {
            const el = document.getElementById('loadingMessage');
            el.innerHTML = msg;
            el.style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loadingMessage').style.display = 'none';
        }

        function backToLogin() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('mfaSection').style.display = 'none';
            document.getElementById('mfaCode').value = '';
        }

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both email and password');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner"></span> Authenticating...';
            btn.disabled = true;
            hideLoading();

            try {
                showLoading('Connecting to XMP...');

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.challenge === 'MFA') {
                    loginSession = data.session;
                    currentUsername = username;
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('mfaSection').style.display = 'block';
                    showLoading('MFA required. Enter your authentication code.');
                    setTimeout(hideLoading, 2000);
                } else if (data.token) {
                    saveTokenAndRedirect(data.token, username);
                } else {
                    showError(data.error || 'Authentication failed');
                }
            } catch (err) {
                console.error('Login error:', err);
                showError('Login failed. Please try again.');
            } finally {
                btn.innerHTML = 'Sign in';
                btn.disabled = false;
                hideLoading();
            }
        }

        async function verifyMfa() {
            const mfaCode = document.getElementById('mfaCode').value.trim();

            if (!mfaCode || mfaCode.length !== 6) {
                showError('Please enter a valid 6-digit code');
                return;
            }

            const btn = event.target;
            btn.innerHTML = '<span class="spinner"></span> Verifying...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/mfa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session: loginSession,
                        code: mfaCode,
                        username: currentUsername
                    })
                });

                const data = await response.json();

                if (data.token) {
                    saveTokenAndRedirect(data.token, currentUsername);
                } else {
                    showError('Invalid authentication code');
                }
            } catch (err) {
                showError('Verification failed');
            } finally {
                btn.innerHTML = 'Verify & Continue';
                btn.disabled = false;
            }
        }

        function saveTokenAndRedirect(token, username) {
    localStorage.setItem('xmp_access_token', token);
    localStorage.setItem('xmp_token_expiry', Date.now() + 3600000);
    
    // Decode token to get user info and company
    try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        const userEmail = payload.email || username;
        const userName = payload.given_name || userEmail.split('@')[0];
        
        localStorage.setItem('xmp_user_email', userEmail);
        localStorage.setItem('xmp_user_name', userName);
        
        // Store user's default company from the token or use a default
        const userCompanyId = payload.company_id || '00000000-0000-0000-0000-000000000001';
        localStorage.setItem('xmp_user_company_id', userCompanyId);
        
        console.log('User logged in:', userName, userEmail);
        console.log('User company:', userCompanyId);
        
    } catch(e) {
        console.log('Could not decode token');
    }
    
    if (document.getElementById('rememberMe')?.checked) {
        localStorage.setItem('xmp_remember_email', username);
    }
    window.location.href = '/dashboard.html';
}

        // Check existing session
        const token = localStorage.getItem('xmp_access_token');
        const expiry = localStorage.getItem('xmp_token_expiry');
        if (token && expiry && Date.now() < parseInt(expiry)) {
            window.location.href = '/dashboard.html';
        }

        // Load remembered email
        const remembered = localStorage.getItem('xmp_remember_email');
        if (remembered) {
            document.getElementById('username').value = remembered;
            document.getElementById('rememberMe').checked = true;
        }

        // Enter key support
        document.getElementById('password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('mfaCode')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyMfa();
        });
    </script>
</body>
</html>
